target-version = "py311"
line-length = 100

extend-exclude = ["*.ipynb_checkpoints"]
# First-party roots, declared rather than inferred. Ruff's default src includes
# "src", which matches SRC/ on a case-insensitive filesystem and not on a
# case-sensitive one, so import sorting differed between macOS and Linux CI.
src = ["SRC", "Evaluation", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[lint.per-file-ignores]
"*.ipynb" = ["E402", "F401", "F811", "I001"]

[format]
quote-style = "double"
